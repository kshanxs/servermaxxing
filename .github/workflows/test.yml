name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/servermaxxing.sh servermaxxing.sh
      - run: shellcheck --severity=error scripts/servermaxxing.sh servermaxxing.sh tests/test_cli.sh tests/test_audit.sh
      - run: bash tests/test_cli.sh
      - run: bash tests/test_audit.sh
